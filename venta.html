
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva Venta - Vivero Inteligente</title>
<link rel="stylesheet" href="css/styles1.css">
</head>
<body>

<div class="contenedor">

<header class="encabezado">
<h1>🌱 ViveroSmart</h1>
<p>Gestión comercial y control de ventas</p>
<h2>Registro de nueva venta</h2>
</header>

<form class="formulario" action="../backend/guardar_venta.php" method="POST">

<section class="seccion">
<h2>1. Información de la venta</h2>

<div class="fila">
<div class="campo">
<label>Número de venta *</label>
<input type="text" name="numero_venta"
placeholder="VEN-001" required>
</div>

<div class="campo">
<label>Fecha de venta *</label>
<input type="date" name="fecha_venta" required>
</div>
</div>

<div class="campo">
<label>Cliente *</label>
<select name="cliente_id" required>
<option value="">Seleccionar cliente</option>
</select>
</div>
</section>

<section class="seccion">
<h2>2. Producto vendido</h2>

<div class="fila">
<div class="campo">
<label>Lote de producción *</label>
<select name="lote_id" required>
<option value="">Seleccionar lote</option>
</select>
</div>

<div class="campo">
<label>Especie</label>
<select name="especie">
<option value="">Seleccionar especie</option>
<option>Arándano</option>
<option>Fresa</option>
<option>Mora</option>
<option>Frambuesa</option>
<option>Manzana</option>
<option>Durazno</option>
<option>Otra</option>
</select>
</div>
</div>

<div class="fila">
<div class="campo">
<label>Cantidad vendida *</label>
<input type="number" id="cantidad"
name="cantidad" min="1" required>
</div>

<div class="campo">
<label>Precio unitario *</label>
<input type="number" id="precio"
name="precio_unitario" min="0" step="0.01" required>
</div>
</div>

<div class="campo">
<label>Total de la venta</label>
<input type="number" id="total"
name="total" readonly>
</div>
</section>

<section class="seccion">
<h2>3. Información de pago</h2>

<div class="fila">
<div class="campo">
<label>Método de pago *</label>
<select name="metodo_pago" required>
<option value="">Seleccionar</option>
<option>Efectivo</option>
<option>Transferencia bancaria</option>
<option>Consignación</option>
<option>Otro</option>
</select>
</div>

<div class="campo">
<label>Estado del pago</label>
<select name="estado_pago">
<option value="Pagado">Pagado</option>
<option value="Pendiente">Pendiente</option>
<option value="Abono">Pago parcial</option>
</select>
</div>
</div>

<div class="campo">
<label>Observaciones</label>
<textarea name="observaciones"
placeholder="Detalles de la venta..."></textarea>
</div>
</section>

<div class="botones">
<button type="submit" class="registrar">Registrar venta</button>
<button type="reset" class="limpiar">Limpiar</button>
</div>

</form>

<footer>© 2026 Vivero Inteligente</footer>
</div>

<script>
const cantidad = document.getElementById("cantidad");
const precio = document.getElementById("precio");
const total = document.getElementById("total");

function calcularTotal() {
    const unidades = Number(cantidad.value) || 0;
    const valor = Number(precio.value) || 0;

    total.value = (unidades * valor).toFixed(2);
}

cantidad.addEventListener("input", calcularTotal);
precio.addEventListener("input", calcularTotal);

</script>

</body>
</html>
